<h1>글 작성하기</h1>

<form>
    <table>
        <tr>
            <th><label for="writer">작성자</label></th>
            <td>
                <input type="text" id="writer" name="writer">
            </td>
        </tr>
        <tr>
            <th><label for="user-id">아이디</label></th>
            <td>
                <input type="text" id="user-id" name="user-id">
            </td>
        </tr>
        <tr>
            <th><label for="email">이메일</label></th>
            <td>
                <input type="text" id="email" name="email">
                @
                <input type="text" name="email-domain" aria-label="이메일 도메인">
            </td>
        </tr>
        <tr>
            <th><label for="phone">휴대폰</label></th>
            <td>
                <select id="phone" name="phone-prefix">
                    <option>010</option>
                    <option>011</option>
                    <option>016</option>
                    <option>017</option>
                    <option>018</option>
                    <option>019</option>
                </select>
                -
                <input type="text" name="phone-middle" size="10"
                       maxlength="4" aria-label="휴대폰 중간 번호">
                -
                <input type="text" name="phone-last" size="10"
                       maxlength="4" aria-label="휴대폰 끝 번호">
            </td>
        </tr>
        <tr>
            <th><label for="subject">글제목</label></th>
            <td>
                <input type="text" id="subject" name="subject">
            </td>
        </tr>
        <tr>
            <th><label for="content">내용</label></th>
            <td>
                <textarea id="content" name="content" rows="10" cols="30"></textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" value="제출"></td>
        </tr>
    </table>
</form>
